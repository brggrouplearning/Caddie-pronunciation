<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIẾNG ANH GIAO TIẾP CƠ BẢN CHO CADDIE - LUYỆN TẬP PHÁT ÂM</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px 10px; background-color: #f0f2f5; margin: 0; color: #333; }
        .external-brand { color: #B21818; font-size: 22px; font-weight: 800; margin-bottom: 12px; letter-spacing: 1.5px; text-transform: uppercase; }
        .container { max-width: 640px; margin: 0 auto; background: white; padding: 25px 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        
        h1 { color: #1e7e34; font-size: 19px; margin-bottom: 4px; font-weight: bold; text-transform: uppercase; line-height: 1.3; }
        .sub-type { color: #666; font-size: 12px; margin-top: 0; margin-bottom: 6px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        #lesson-subtitle { color: #0d6efd; font-size: 14px; margin-top: 0; margin-bottom: 18px; font-weight: bold; text-transform: uppercase; }
        
        /* GIAO DIỆN THÔNG TIN HỌC VIÊN SONG NGỮ */
        .user-card { background: #ffffff; border: 2px solid #e7f1ff; border-radius: 12px; padding: 20px; text-align: left; box-shadow: 0 4px 12px rgba(13, 110, 253, 0.05); margin-bottom: 10px; }
        .user-card-header { font-size: 15px; font-weight: bold; color: #0d6efd; border-bottom: 2px solid #e7f1ff; padding-bottom: 8px; margin-bottom: 15px; text-align: center; text-transform: uppercase; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-group { margin-bottom: 12px; }
        .form-group.full-width { grid-column: span 2; }
        .form-group label { display: block; font-weight: 600; font-size: 12.5px; color: #495057; margin-bottom: 5px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1.5px solid #ced4da; border-radius: 8px; font-size: 13.5px; transition: all 0.2s ease; outline: none; background-color: #fff; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #0d6efd; box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15); }
        
        .selection-box { background: #f8f9fa; border: 1.5px dashed #b6d4fe; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; transition: border-color 0.2s; }
        .selection-box.active { border-color: #0d6efd; background: #f0f7ff; }
        .selection-header { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 13px; color: #0d6efd; margin-bottom: 6px; cursor: pointer; }
        .selection-header input[type="radio"] { width: 16px; height: 16px; cursor: pointer; accent-color: #0d6efd; }

        .btn-start-quiz { width: 100%; padding: 13px; font-size: 15px; font-weight: bold; color: white; background: #198754; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 10px rgba(25, 135, 84, 0.25); transition: background 0.2s; }
        .btn-start-quiz:hover { background: #146c43; }

        /* VIEW LÀM BÀI */
        .info-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 8px; }
        #item-status { font-size: 12px; font-weight: bold; padding: 6px 12px; border-radius: 20px; display: inline-block; }
        .status-passed { background-color: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
        .status-approx { background-color: #cff4fc; color: #055160; border: 1px solid #b6effb; }
        .status-skipped { background-color: #e2e3e5; color: #383d41; border: 1px solid #d6d8db; }
        .status-pending { background-color: #fff3cd; color: #664d03; border: 1px solid #ffecb5; }

        #timer-box { font-size: 12px; font-weight: bold; background: #e7f1ff; padding: 6px 12px; border-radius: 20px; display: inline-block; color: #0d6efd; border: 1px solid #b6d4fe; }
        .blink-red { background-color: #f8d7da !important; color: #721c24 !important; border-color: #f5c6cb !important; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        .progress-box { font-size: 14px; color: #333; font-weight: bold; background: #f8f9fa; padding: 8px 16px; border-radius: 8px; display: inline-block; margin-bottom: 10px; border: 1px solid #dee2e6; }
        .progress-box span { color: #d9534f; font-size: 16px; }
        .section-tag { font-size: 13.5px; color: #555; font-weight: normal; }

        .btn-group { margin-top: 18px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        button { padding: 11px 15px; font-size: 14px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        #prev-btn { background: #fd7e14; color: white; }
        #listen-btn { background: #17a2b8; color: white; }
        #speak-btn { background: #0d6efd; color: white; }
        #skip-btn { background: #6c757d; color: white; }
        
        #question { font-size: 18px; font-weight: bold; color: #212529; margin: 15px 0 10px 0; min-height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.4; background: #f8f9fa; padding: 14px; border-radius: 10px; border: 1px solid #e9ecef; }
        .ipa-phonetic { font-size: 13px; color: #6c757d; font-style: italic; margin-top: 4px; font-weight: normal; }
        .vietnamese-translation { font-size: 13.5px; font-style: italic; color: #555; margin-top: 6px; font-weight: normal; }
        
        #status { font-size: 14px; font-weight: bold; color: #0d6efd; margin-top: 12px; }
        #error { color: #dc3545; font-weight: bold; margin-top: 8px; font-size: 13.5px; }
        
        /* RESULT CARD & FEEDBACK */
        .result-card { text-align: center; }
        .score-box { font-size: 38px; font-weight: bold; color: #1e7e34; margin: 8px 0 4px 0; }
        .level-badge { display: inline-block; padding: 6px 18px; border-radius: 20px; font-weight: bold; font-size: 14px; margin-bottom: 12px; }
        .level-excellent { background-color: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
        .level-passed { background-color: #cff4fc; color: #055160; border: 1px solid #b6effb; }
        .level-needs-improvement { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .stats-box { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 10px; padding: 14px; margin: 15px 0; text-align: left; font-size: 13.5px; line-height: 1.6; }
        
        .feedback-card { background: #fff8e6; border: 1px solid #ffe8a1; border-radius: 10px; padding: 12px 15px; margin-top: 15px; text-align: left; }
        .feedback-card label { font-size: 13px; font-weight: bold; color: #8c6d00; display: block; margin-bottom: 6px; }
        .feedback-card textarea { 
            width: 100%; 
            resize: vertical; 
            min-height: 70px;
            max-height: 250px;
            padding: 10px 12px; 
            border: 1.5px solid #ffe082; 
            border-radius: 8px; 
            font-size: 13px; 
            font-family: inherit; 
            outline: none; 
            background: #ffffff; 
        }
        .feedback-card textarea:focus { border-color: #ffc107; box-shadow: 0 0 0 3px rgba(255, 193, 7, 0.2); }
        .btn-send-feedback { background: #ffc107; color: #000; font-weight: bold; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; margin-top: 8px; width: 100%; transition: background 0.2s; }
        .btn-send-feedback:hover { background: #e0a800; }

        .action-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 15px; flex-wrap: wrap; }
        .btn-review { background: #17a2b8; color: white; flex: 1; padding: 11px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; min-width: 130px; }
        .btn-retry { background: #0d6efd; color: white; flex: 1; padding: 11px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; min-width: 130px; }

        #review-container { text-align: left; margin-top: 10px; max-height: 350px; overflow-y: auto; padding-right: 5px; }
        .review-item { background: #f8f9fa; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 13.5px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e9ecef; }
        .review-text-group { display: flex; flex-direction: column; }
        .review-trans { font-size: 12px; font-style: italic; color: #6c757d; margin-top: 2px; }
        .btn-audio-small { background: #198754; color: white; padding: 5px 10px; font-size: 12px; border-radius: 6px; cursor: pointer; border: none; font-weight: bold; }
        
        .mispronounced-word { color: #dc3545 !important; font-weight: bold !important; font-style: italic !important; text-decoration: underline; }
        .hidden { display: none !important; }
        #save-status-msg { font-size: 12.5px; font-weight: bold; color: #0f5132; margin-top: 8px; background: #d1e7dd; padding: 8px 14px; border-radius: 20px; display: inline-block; border: 1px solid #badbcc; }
    </style>
</head>

    <!-- KHỞI TẠO MẢNG DỮ LIỆU CHUNG -->
    <script> window.masterQuizData = []; </script>

    <script>
        (function loadAllDataFiles() {
            const filesToLoad = ['data/exams.js'];
            for (let i = 1; i <= 10; i++) {
                filesToLoad.push(`data/lesson${i}.js`);
            }

            let loadedCount = 0;
            let isInitialized = false;

            const checkAndInit = () => {
                if (isInitialized) return;
                isInitialized = true;
                if (typeof initApp === 'function') initApp();
            };

            filesToLoad.forEach(src => {
                const script = document.createElement('script');
                script.src = src;
                script.async = false;
                script.onload = script.onerror = () => {
                    loadedCount++;
                    if (loadedCount === filesToLoad.length) {
                        checkAndInit();
                    }
                };
                document.head.appendChild(script);
            });
        })();
    </script>

    <!-- CORE ENGINE LUYỆN PHÁT ÂM -->
    <script>
        // CẬP NHẬT URL WEB APP MỚI CỦA ANH
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwPRqDyawoMEz6EOlYxh6JsG6HYw38V3g5kdxK0w1Yyk0viyKh1cHNR3z0aEMD8R1H7vw/exec';

        function toggleContentMode(mode) {
            const radioSection = document.getElementById('mode-section');
            const radioExam = document.getElementById('mode-exam');
            const selectSection = document.getElementById('select-section');
            const selectExam = document.getElementById('select-exam');
            const boxSection = document.getElementById('box-section');
            const boxExam = document.getElementById('box-exam');

            if (mode === 'section') {
                radioSection.checked = true;
                selectSection.disabled = false;
                boxSection.classList.add('active');

                radioExam.checked = false;
                selectExam.disabled = true;
                selectExam.value = "";
                boxExam.classList.remove('active');
            } else if (mode === 'exam') {
                radioExam.checked = true;
                selectExam.disabled = false;
                boxExam.classList.add('active');

                radioSection.checked = false;
                selectSection.disabled = true;
                selectSection.value = "";
                boxSection.classList.remove('active');
            }
        }

        function syncRadioOnSelect(mode) {
            toggleContentMode(mode);
        }

        function cleanSectionCode(secStr) {
            if (secStr === null || secStr === undefined) return "";
            return secStr.toString().toLowerCase().replace(/section/gi, '').replace(/\s+/g, '').trim();
        }

        function normalizeText(str) {
            if (!str) return "";
            const numberMap = {
                '1st': 'first', '2nd': 'second', '3rd': 'third', '4th': 'fourth', '5th': 'fifth',
                '6th': 'sixth', '7th': 'seventh', '8th': 'eighth', '9th': 'ninth', '10th': 'tenth',
                '1': 'one', '2': 'two', '3': 'three', '4': 'four', '5': 'five',
                '6': 'six', '7': 'seven', '8': 'eight', '9': 'nine', '10': 'ten',
                '14': 'fourteen', '17': 'seventeen', '18': 'eighteen'
            };

            let text = str.toLowerCase();
            Object.keys(numberMap).forEach(key => {
                const regex = new RegExp(`\\b${key}\\b`, 'g');
                text = text.replace(regex, numberMap[key]);
            });

            return text.replace(/[^a-z0-9\s]/g, "").replace(/\s+/g, " ").trim();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function getFilteredSpeakingItemsBySelection(isSectionMode, selectedVal) {
            let rawPool = (window.masterQuizData && window.masterQuizData.length > 0) ? [...window.masterQuizData] : [];
            let filtered = [];
            let targetCount = 20; 
            let titleBanner = "LUYỆN PHÁT ÂM TỔNG HỢP";

            if (isSectionMode && selectedVal) {
                titleBanner = `LUYỆN PHÁT ÂM - SECTION ${selectedVal}`;
                let cleanTarget = cleanSectionCode(selectedVal);
                filtered = rawPool.filter(q => q.section && cleanSectionCode(q.section) === cleanTarget);
                targetCount = 20;
            } else if (!isSectionMode && selectedVal) {
                if (selectedVal === 'all') {
                    titleBanner = "KIỂM TRA PHÁT ÂM CUỐI KHÓA - FINAL EXAM";
                    filtered = [...rawPool];
                    targetCount = 30;
                } else {
                    titleBanner = `KIỂM TRA PHÁT ÂM - EXAM ${selectedVal}`;
                    let examLessons = selectedVal.split('-').map(n => n.trim());
                    filtered = rawPool.filter(q => {
                        let qLes = (q.lesson || "").toString().replace(/[^\d]/g, '');
                        return examLessons.includes(qLes);
                    });
                    targetCount = 30;
                }
            }

            const subTitleElem = document.getElementById('lesson-subtitle');
            if (subTitleElem) subTitleElem.innerText = titleBanner;

            let resultList = [];
            filtered.forEach(item => {
                let targetText = item.audioText || item.text || item.en || "";
                let meaningText = item.translation || item.meaning || item.vi || "";
                let ipaText = item.phonetic || item.ipa || "";

                if (!targetText && item.type === "mcq" && item.options && item.options[item.correct]) {
                    targetText = item.options[item.correct].en || item.options[item.correct].text || "";
                    meaningText = item.options[item.correct].vi || item.options[item.correct].meaning || "";
                }

                targetText = targetText.replace(/^[A-D]\.\s*/, "").trim();

                // LỌC SẠCH MÃ TRÍCH DẪN RÁC
                if (meaningText) {
                    meaningText = meaningText.replace(/\+\]/gi, '').replace(/cite:\s*[\d,\s]+/gi, '').replace(/\[\s*\]/gi, '').trim();
                }

                if (targetText && targetText.length > 1) {
                    resultList.push({ 
                        text: targetText, 
                        meaning: meaningText || "Mẫu câu giao tiếp Caddie chuẩn",

        function editDistance(s1, s2) {
            s1 = s1.toLowerCase();
            s2 = s2.toLowerCase();
            let costs = new Array(s2.length + 1);
            
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i === 0) {
                        costs[j] = j;
                    } else if (j > 0) {
                        let newValue = costs[j - 1];
                        if (s1.charAt(i - 1) !== s2.charAt(j - 1)) {
                            newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                        }
                        costs[j - 1] = lastValue;
                        lastValue = newValue;
                    }
                }
                if (i > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }

        function getSimilarityScore(s1, s2) {
            let longer = s1.length < s2.length ? s2 : s1;
            let shorter = s1.length < s2.length ? s1 : s2;
            if (longer.length === 0) return 1.0;
            return (longer.length - editDistance(longer, shorter)) / parseFloat(longer.length);
        }

        function formatTime(seconds) {
            let mins = Math.floor(seconds / 60);
            let secs = seconds % 60;
            return (mins > 0 ? `${mins} phút ` : "") + `${secs} giây`;
        }

        function formatHighlightedSentence(targetText, spokenText) {
            if (!spokenText) return targetText;
            
            let targetWords = targetText.split(/\s+/);
            let spokenNormalized = normalizeText(spokenText);
            let spokenWordsSet = new Set(spokenNormalized.split(/\s+/));
            
            return targetWords.map(word => {
                let cleanWord = normalizeText(word);
                if (cleanWord === "" || spokenWordsSet.has(cleanWord)) {
                    return word; 
                } else {
                    return `<span class="mispronounced-word">${word}</span>`;
                }
            }).join(" ");
        }

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                document.getElementById('error').innerText = "Trình duyệt không hỗ trợ nhận diện giọng nói. Vui lòng sử dụng Google Chrome.";
                return;
            }

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                document.getElementById('status').innerText = "🎙️ Đang lắng nghe... Hãy nói câu tiếng Anh trên màn hình.";
                document.getElementById('error').innerText = "";
            };

            recognition.onerror = (event) => {
                document.getElementById('status').innerText = "Chưa nhận diện được giọng nói!";
                if (event.error === 'not-allowed') {
                    document.getElementById('error').innerText = "Chưa cấp quyền Micro. Vui lòng cho phép Micro trên trình duyệt.";
                } else {
                    document.getElementById('error').innerText = "Chưa nghe rõ, vui lòng bấm nói lại.";
                }
            };

            recognition.onresult = function(event) {
                const rawTranscript = event.results[0][0].transcript;
                const normTarget = normalizeText(activeItems[currentIndex].text);
                const normSpoken = normalizeText(rawTranscript);

                itemTranscripts[currentIndex] = rawTranscript; 
                const similarity = getSimilarityScore(normTarget, normSpoken);

                if (normSpoken.includes(normTarget) || normTarget.includes(normSpoken) || similarity >= 0.80) {
                    itemStatus[currentIndex] = 'passed';
                    document.getElementById('status').innerText = "✅ Chính xác! Phát âm rất tốt.";
                    const statusTag = document.getElementById('item-status');
                    statusTag.className = "status-passed";
                    statusTag.innerText = "✅ Trạng thái: Đạt";

                    setTimeout(() => { 
                        if (currentIndex === activeItems.length - 1) {
                            finishSession("🎉 NỘP BÀI THÀNH CÔNG!");
                        } else {
                            currentIndex++; 
                            showQuestion(); 
                        }
                    }, 1500);

                } else if (similarity >= 0.45) {
                    itemStatus[currentIndex] = 'approx';
                    document.getElementById('status').innerText = `🟡 Bạn nói: "${rawTranscript}". Gần đúng, bạn có thể nói lại hoặc bấm Câu tiếp.`;
                    const statusTag = document.getElementById('item-status');
                    statusTag.className = "status-approx";
                    statusTag.innerText = "🟡 Trạng thái: Gần đúng";

                } else {
                    document.getElementById('status').innerText = `❌ Bạn nói: "${rawTranscript}". Hãy thử lại hoặc bấm Bỏ qua/Câu tiếp.`;
                }
            };

            recognition.start();
        }
    </script>
</body>
</html>
